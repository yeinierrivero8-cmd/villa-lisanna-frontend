<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Villa Lisanna - Beach House</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Public Sans', -apple-system, sans-serif;
    }

    .hero {
      position: relative;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      overflow: hidden;
    }

    .hero-media {
      position: absolute;
      inset: 0;
      z-index: 0;
    }

    .hero-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hero-scrim {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.1) 0%,
        rgba(255, 255, 255, 0) 30%,
        rgba(0, 0, 0, 0.15) 100%
      );
      z-index: 1;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 40px;
      height: 100%;
    }

    .logo-box {
      margin-bottom: auto;
      padding-top: 40px;
    }

    .logo {
      font-family: 'Archivo Expanded', serif;
      font-size: 2.8rem;
      font-weight: 700;
      color: #1B4965;
      letter-spacing: -0.01em;
      line-height: 1.1;
      margin-bottom: 4px;
    }

    .tagline {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.85rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #D4AF7A;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .location {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.78rem;
      letter-spacing: 0.04em;
      color: #8F8C82;
      text-transform: uppercase;
    }

    .hero-actions {
      display: flex;
      gap: 16px;
      margin-top: auto;
      margin-bottom: 60px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      padding: 14px 32px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.92rem;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Public Sans', sans-serif;
      text-decoration: none;
      display: inline-block;
    }

    .btn-primary {
      background: linear-gradient(160deg, #2E6F8E 0%, #1B4965 100%);
      color: white;
      box-shadow: 0 18px 40px -12px rgba(27, 73, 101, 0.45);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 24px 48px -10px rgba(27, 73, 101, 0.55);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.15);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(10px);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.25);
      border-color: rgba(255, 255, 255, 0.5);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .hero-content {
        padding: 40px 24px;
      }

      .logo {
        font-size: 2rem;
      }

      .tagline {
        font-size: 0.75rem;
      }

      .hero-actions {
        gap: 12px;
        margin-bottom: 40px;
      }

      .btn {
        padding: 12px 24px;
        font-size: 0.86rem;
      }
    }
  </style>
</head>
<body>

<section class="hero">
  <div class="hero-media">
    <img src="C:\Users\yeini\.claude\uploads\46a6e8b3-5f75-5124-9102-0d59eb4d8f67\dd02b639-image.png" alt="Villa Lisanna - Playa privada en Little Gasparilla Island">
  </div>
  <div class="hero-scrim"></div>

  <div class="hero-content">
    <div class="logo-box">
      <p class="tagline">Villa de Lujo • Little Gasparilla Island</p>
      <h1 class="logo">Villa Lisanna</h1>
      <p class="location">🏝️ Beach House Privada</p>
    </div>

    <div class="hero-actions">
      <a href="#reservar" class="btn btn-primary">Reservar Ahora</a>
      <a href="#fotos" class="btn btn-secondary">Ver Fotos</a>
    </div>
  </div>
</section>

</body>
</html>
